<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b3a6e">
<title>会員サイト｜普賢アーカイブ運営委員会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/member.css">
<link rel="icon" href="LOGO.png">
<style>
  body { margin: 0; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); z-index: 300; transition: opacity .5s; }
  #boot img { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 0 0 2px var(--gold); animation: bootPulse 1.6s ease-in-out infinite; }
  @keyframes bootPulse { 50% { box-shadow: 0 0 0 2px var(--gold), 0 0 0 16px rgba(212,175,55,0), 0 0 40px rgba(212,175,55,.4); transform: scale(1.04); } }
  #boot.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body class="lux">
<!--
  会員サイト本体です。画面の中身は assets/js/member.js で作られます。
  ・メニュー項目        → member.js の ROUTES
  ・会員証のデザイン    → assets/css/member.css の「会員証」
-->
<div id="boot" aria-label="読み込み中"><img src="LOGO.png" alt=""></div>

<!-- 審査中・停止中などの案内 -->
<div id="gate" hidden></div>

<!-- 会員ポータル -->
<div class="portal" id="portal" hidden>
  <aside class="sidebar">
    <a class="auth-brand" href="#dashboard"><img src="LOGO.png" alt="">普賢アーカイブ<br>運営委員会</a>
    <ul class="side-nav" id="side-nav"></ul>
    <div class="side-bottom">
      <div class="me">
        <div class="avatar" id="me-avatar"></div>
        <div><div class="me-name" id="me-name"></div><div class="me-type" id="me-type"></div></div>
      </div>
      <ul class="side-nav">
        <li><a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>公式サイトへ</a></li>
        <li><a href="#" data-action="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>ログアウト</a></li>
      </ul>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="view-title"></h1>
      <button class="search-trigger" id="open-palette" aria-label="検索・移動（Ctrl+K）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span class="lbl">検索・ページ移動</span><kbd>Ctrl K</kbd>
      </button>
      <!-- 公式サイト（一般のページ）へ戻る。スマホではサイドメニューが無いのでここから戻る -->
      <a class="site-link" href="index.html" aria-label="公式サイトへ戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span>公式サイト</span>
      </a>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="会員メニュー"></nav>
</div>

<!-- 会員証のスキャン用表示（全画面。assets/js/member.js の openScan） -->
<div class="scan-view" id="scan-view" hidden tabindex="-1" role="dialog" aria-modal="true" aria-label="会員証（スキャン用）"></div>

<!-- コマンドパレット -->
<div class="palette-bg" id="palette-bg" role="dialog" aria-modal="true" aria-label="検索・移動">
  <div class="palette">
    <div class="palette-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="palette-q" placeholder="ページ・お知らせ・資料・行事を検索…" autocomplete="off" aria-label="検索">
      <kbd>Esc</kbd>
    </div>
    <ul id="palette-list" role="listbox"></ul>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd>選択</span><span><kbd>Enter</kbd>開く</span><span><kbd>1</kbd>〜<kbd>6</kbd>ページ移動</span></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- 会員証のQRコード生成ライブラリ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module" src="assets/js/member.js"></script>
</body>
</html>
