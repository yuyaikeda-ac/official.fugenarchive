<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資料提供・お問い合わせ｜普賢アーカイブ運営委員会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="LOGO.png">
<script src="assets/js/common.js" defer></script>
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="page-head">
    <div class="inner">
      <h1>資料提供・お問い合わせ</h1>
      <p>CONTACT</p>
    </div>
  </div>
  <div class="inner">
    <ol class="breadcrumb"><li><a href="index.html">ホーム</a></li><li>資料提供・お問い合わせ</li></ol>
  </div>

  <div class="inner content">
    <p>普賢に関する資料のご提供、委員会へのお問い合わせは、以下のフォームよりお送りください。</p>
    <p class="notice info" style="font-size:13px">お問い合わせには、まず <strong>AI オペレータ</strong>（Anthropic 社の AI「Claude」）が自動で 1 次対応し、パスワードの再設定などはその場でご案内します。AI には、お名前・メールアドレス・電話番号・住所などの<strong>個人情報を伏せた内容だけ</strong>を渡します。担当者の確認が必要な内容は、担当者より折り返しご連絡いたします。</p>

    <form class="form" id="contact-form">
      <div class="form-row">
        <label for="subject">お問い合わせ種別<span class="req">必須</span></label>
        <select id="subject" name="subject" required>
          <option value="">選択してください</option>
          <option>資料提供について</option>
          <option>アーカイブの利用について</option>
          <option>行事・イベントについて</option>
          <option>その他</option>
        </select>
      </div>
      <div class="form-row">
        <label for="name">お名前<span class="req">必須</span></label>
        <input type="text" id="name" name="name" required maxlength="100">
      </div>
      <div class="form-row">
        <label for="email">メールアドレス<span class="req">必須</span></label>
        <input type="email" id="email" name="email" required maxlength="200">
      </div>
      <div class="form-row">
        <label for="message">お問い合わせ内容<span class="req">必須</span></label>
        <textarea id="message" name="message" required maxlength="5000"></textarea>
      </div>
      <div class="form-row">
        <label><input type="checkbox" id="agree" required> <span><a href="privacy.html" target="_blank">プライバシーポリシー</a>に同意する</span></label>
      </div>
      <div id="result"></div>
      <button type="submit" class="btn btn-primary" id="submit">送信する</button>
    </form>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { addContact, isDemo } from "./assets/js/db.js";
  import { showDemoBanner } from "./assets/js/render.js";
  if (isDemo) showDemoBanner();

  const form = document.getElementById("contact-form");
  const result = document.getElementById("result");
  const btn = document.getElementById("submit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = "送信中…";
    try {
      const f = form.elements;
      await addContact({
        subject: f.subject.value,
        name: f.name.value.trim(),
        email: f.email.value.trim(),
        message: f.message.value.trim()
      });
      form.reset();
      result.innerHTML = '<div class="notice success">送信しました。お問い合わせありがとうございました。</div>';
    } catch (err) {
      console.error(err);
      result.innerHTML = '<div class="notice error">送信に失敗しました。時間をおいて再度お試しください。</div>';
    } finally {
      btn.disabled = false; btn.textContent = "送信する";
    }
  });
</script>
</body>
</html>
