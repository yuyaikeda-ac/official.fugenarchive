<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>会員証の確認｜普賢アーカイブ運営委員会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="LOGO.png">
<script src="assets/js/common.js" defer></script>
<style>
  .verify { max-width: 592px; margin: 0 auto; padding-top: 40px; padding-bottom: 72px; }
  .v-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 24px 48px -24px rgba(16,36,70,.3); }
  .v-status { display: flex; align-items: center; gap: 16px; padding: 24px 28px; color: #fff; }
  .v-status .icon { width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.2); font-size: 26px; font-weight: 700; }
  .v-status h1 { margin: 0; font-size: 22px; font-family: var(--font-serif); letter-spacing: .04em; }
  .v-status p { margin: 2px 0 0; font-size: 13px; opacity: .9; }
  .v-status.ok { background: linear-gradient(135deg, #1e8a57, #146b42); }
  .v-status.warn { background: linear-gradient(135deg, #b7791f, #8f5d14); }
  .v-status.ng { background: linear-gradient(135deg, #8a94a3, #5b6470); }
  .v-body { padding: 8px 28px 24px; }
  .v-org { display: flex; align-items: center; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--border); }
  .v-org img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px var(--accent); }
  .v-org strong { display: block; font-family: var(--font-serif); color: var(--main); }
  .v-org small { color: var(--text-sub); font-size: 11px; letter-spacing: .1em; }
  .v-list { margin: 0; }
  .v-list div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px dashed var(--border); }
  .v-list dt { color: var(--text-sub); font-size: 13px; }
  .v-list dd { margin: 0; font-weight: 500; color: var(--text); }
  .v-list .no { font-family: "Noto Serif JP", serif; font-size: 20px; font-weight: 700; letter-spacing: .08em; color: var(--main); }
  .v-time { margin: 16px 0 0; font-size: 12px; color: var(--text-sub); text-align: right; }
  .v-note { margin-top: 20px; font-size: 13px; color: var(--text-sub); line-height: 1.9; }
  .v-skel { height: 220px; display: grid; place-items: center; color: var(--text-sub); }
</style>
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="page-head">
    <div class="inner"><h1>会員証の確認</h1><p>MEMBERSHIP VERIFICATION</p></div>
  </div>

  <div class="inner verify">
    <div class="v-card" id="result"><div class="v-skel">確認しています…</div></div>
    <p class="v-note">このページは、普賢アーカイブ運営委員会のデジタル会員証に印字されたQRコードから表示される確認ページです。表示内容は委員会のデータベースの最新の情報です。ご不明な点は <a href="contact.html">お問い合わせ</a> ください。</p>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { db, esc } from "./assets/js/db.js";

  const TYPE = { regular: "正会員", associate: "準会員", student: "学生会員" };
  const box = document.getElementById("result");
  const ymd = (v) => { const d = v?.toDate ? v.toDate() : v ? new Date(v) : null; return d && !isNaN(d) ? `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日` : "—"; };
  const now = new Date();

  const status = (cls, icon, title, sub) => `<div class="v-status ${cls}"><div class="icon">${icon}</div><div><h1>${title}</h1><p>${sub}</p></div></div>`;

  async function run() {
    const t = new URLSearchParams(location.search).get("t") || "";
    if (!/^[0-9a-f]{32}$/.test(t)) {
      box.innerHTML = status("ng", "?", "確認できませんでした", "QRコードの内容が正しくありません。");
      return;
    }
    let card = null;
    try {
      const snap = await getDoc(doc(db, "cards", t));
      card = snap.exists() ? snap.data() : null;
    } catch (e) {
      console.error(e);
      box.innerHTML = status("ng", "!", "確認できませんでした", "通信エラーが発生しました。時間をおいて再度お試しください。");
      return;
    }
    if (!card) {
      box.innerHTML = status("ng", "×", "この会員証は確認できません", "登録されていないか、すでに無効になっています。");
      return;
    }

    const expired = card.validUntil && new Date(card.validUntil + "T23:59:59") < now;
    let head;
    if (card.status === "active" && !expired) head = status("ok", "✓", "有効な会員です", "普賢アーカイブ運営委員会の会員資格が確認できました。");
    else if (card.status === "active" && expired) head = status("warn", "!", "有効期限が切れています", "会員資格の有効期限を過ぎています。");
    else if (card.status === "suspended") head = status("warn", "!", "会員資格停止中", "この会員の資格は現在停止されています。");
    else head = status("ng", "×", "無効な会員証です", "この会員証は現在有効ではありません。");

    box.innerHTML = head + `
      <div class="v-body">
        <div class="v-org"><img src="LOGO.png" alt=""><div><strong>普賢アーカイブ運営委員会</strong><small>FUGEN ARCHIVE DEVELOPMENT COMMITTEE</small></div></div>
        <dl class="v-list">
          <div><dt>会員番号</dt><dd class="no">${esc(card.memberNo)}</dd></div>
          <div><dt>氏名</dt><dd>${esc(card.name)} 様</dd></div>
          <div><dt>会員種別</dt><dd>${esc(TYPE[card.type] || card.type)}</dd></div>
          <div><dt>入会日</dt><dd>${ymd(card.approvedAt)}</dd></div>
          ${card.validUntil ? `<div><dt>有効期限</dt><dd>${ymd(card.validUntil)}</dd></div>` : ""}
        </dl>
        <p class="v-time">確認日時：${now.toLocaleString("ja-JP")}</p>
      </div>`;
  }
  run();
</script>
</body>
</html>
