<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お知らせ｜普賢アーカイブ運営委員会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="LOGO.png">
<script src="assets/js/common.js" defer></script>
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="page-head">
    <div class="inner">
      <h1>お知らせ</h1>
      <p>NEWS</p>
    </div>
  </div>
  <div class="inner">
    <ol class="breadcrumb"><li><a href="index.html">ホーム</a></li><li><a href="news.html">お知らせ</a></li><li id="crumb-current" hidden></li></ol>
  </div>

  <div class="inner content">
    <!-- 一覧表示 -->
    <div id="list-view">
      <!-- ★ お知らせのタブ
           ・タブの名前はここを書き換えてください
           ・data-key はお知らせの「区分」の値です（assets/js/db.js の NEWS_CATEGORIES の key と同じにしてください）
           ・タブを増やすときは <button> を1行コピーして、data-key と名前を変えます -->
      <div class="news-tabs" role="tablist" aria-label="お知らせの区分" id="news-tabs">
        <button role="tab" data-key=""        class="is-active" aria-selected="true">すべて<span class="cnt"></span></button>
        <button role="tab" data-key="topics"  aria-selected="false" tabindex="-1">トピックス<span class="cnt"></span></button>
        <button role="tab" data-key="kaikoku" aria-selected="false" tabindex="-1">会告<span class="cnt"></span></button>
        <button role="tab" data-key="event"   aria-selected="false" tabindex="-1">行事・イベント<span class="cnt"></span></button>
        <button role="tab" data-key="archive" aria-selected="false" tabindex="-1">アーカイブ更新<span class="cnt"></span></button>
        <button role="tab" data-key="recruit" aria-selected="false" tabindex="-1">募集<span class="cnt"></span></button>
        <button role="tab" data-key="report"  aria-selected="false" tabindex="-1">活動報告<span class="cnt"></span></button>
      </div>
      <ul class="news-list" id="news-list"><li class="loading">読み込み中…</li></ul>
    </div>

    <!-- 詳細表示（news.html?id=xxx のとき） -->
    <article id="detail-view" hidden>
      <div class="article-head">
        <div id="detail-meta"></div>
        <h1 id="detail-title"></h1>
      </div>
      <div class="article-body" id="detail-body"></div>
      <div class="btn-wrap center" style="margin-top:48px"><a class="btn" href="news.html">お知らせ一覧へ戻る</a></div>
    </article>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { getNews, getNewsById, newsItemHtml, esc, fmtDate, categoryBadge, isDemo } from "./assets/js/db.js";
  import { showDemoBanner } from "./assets/js/render.js";
  if (isDemo) showDemoBanner();

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  if (id) {
    // ---- 詳細 ----
    document.getElementById("list-view").hidden = true;
    document.getElementById("detail-view").hidden = false;
    const n = await getNewsById(id).catch(e => (console.error(e), null));
    if (!n) {
      document.getElementById("detail-title").textContent = "お知らせが見つかりませんでした。";
    } else {
      document.title = `${n.title}｜普賢アーカイブ運営委員会`;
      document.getElementById("detail-meta").innerHTML =
        `<time>${esc(fmtDate(n.date))}</time> ${categoryBadge(n.category)}`
        + (n.important ? ' <span class="cat cat-important">重要</span>' : "");
      document.getElementById("detail-title").textContent = n.title;
      document.getElementById("detail-body").textContent = n.body || "";
      const crumb = document.getElementById("crumb-current");
      crumb.textContent = n.title; crumb.hidden = false;
    }
  } else {
    // ---- 一覧 ----
    const listEl = document.getElementById("news-list");
    // タブは HTML（上の news-tabs）に書いてあるものを使います
    const tabBtns = [...document.querySelectorAll("#news-tabs [role=tab]")];
    let all = null;
    const render = (cat) => {
      if (!tabBtns.some(b => b.dataset.key === cat)) cat = "";
      tabBtns.forEach(b => {
        const on = b.dataset.key === cat;
        b.classList.toggle("is-active", on);
        b.setAttribute("aria-selected", on);
        b.tabIndex = on ? 0 : -1;
      });
      if (!all) return;
      const rows = cat ? all.filter(n => n.category === cat) : all;
      listEl.innerHTML = rows.length ? rows.map(newsItemHtml).join("") : '<li class="empty">お知らせはありません。</li>';
    };
    const select = (b) => {
      history.replaceState(null, "", b.dataset.key ? `?cat=${encodeURIComponent(b.dataset.key)}` : "news.html");
      render(b.dataset.key);
    };
    tabBtns.forEach(b => b.addEventListener("click", () => select(b)));
    // ← → キーでタブ移動
    document.getElementById("news-tabs").addEventListener("keydown", e => {
      const i = tabBtns.indexOf(document.activeElement);
      if (i < 0 || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
      e.preventDefault();
      const n = e.key === "Home" ? 0 : e.key === "End" ? tabBtns.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + tabBtns.length) % tabBtns.length;
      tabBtns[n].focus(); select(tabBtns[n]);
    });
    render(params.get("cat") || "");
    try {
      all = await getNews();
      tabBtns.forEach(b => {
        const n = b.dataset.key ? all.filter(x => x.category === b.dataset.key).length : all.length;
        b.querySelector(".cnt").textContent = n ? n : "";
      });
      render(params.get("cat") || "");
    } catch (e) {
      console.error(e);
      listEl.innerHTML = '<li class="empty">お知らせを読み込めませんでした。</li>';
    }
  }
</script>
</body>
</html>
