<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行事・イベント｜普賢アーカイブ運営委員会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="LOGO.png">
<script src="assets/js/common.js" defer></script>
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="page-head">
    <div class="inner">
      <h1>行事・イベント</h1>
      <p>EVENTS</p>
    </div>
  </div>
  <div class="inner">
    <ol class="breadcrumb"><li><a href="index.html">ホーム</a></li><li>行事・イベント</li></ol>
  </div>

  <div class="inner content">
    <h2>今後の予定</h2>
    <ul class="event-list" id="upcoming"><li class="loading">読み込み中…</li></ul>
    <h2>過去の行事</h2>
    <ul class="event-list" id="past"><li class="loading">読み込み中…</li></ul>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { getEvents, isDemo } from "./assets/js/db.js";
  import { eventItemHtml, renderEventBodies, showDemoBanner } from "./assets/js/render.js";
  if (isDemo) showDemoBanner();

  const fill = (id, rows, msg) => {
    const el = document.getElementById(id);
    el.innerHTML = rows.length ? rows.map(r => eventItemHtml(r, { detail: true })).join("") : `<li class="empty">${msg}</li>`;
    renderEventBodies(el, rows);
  };
  try {
    const rows = await getEvents();
    const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
    fill("upcoming", rows.filter(r => r.date >= today).reverse(), "現在予定されている行事はありません。");
    fill("past", rows.filter(r => r.date < today), "過去の行事はありません。");
  } catch (e) {
    console.error(e);
    fill("upcoming", [], "行事を読み込めませんでした。");
    fill("past", [], "");
  }
</script>
</body>
</html>
